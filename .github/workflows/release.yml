name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install OpenTelemetry plugin dependencies
        run: npm install --prefix packages/otel-plugin --no-audit --no-fund

      - name: Install @rdcp.dev/server for otel-plugin build (registry if available, otherwise local)
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @rdcp.dev/server@"$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "Installing @rdcp.dev/server@$CURRENT_VERSION from registry"
            npm install --prefix packages/otel-plugin @rdcp.dev/server@"$CURRENT_VERSION" --no-audit --no-fund
          else
            echo "@rdcp.dev/server@$CURRENT_VERSION not yet in registry; installing local package for build"
            npm install --prefix packages/otel-plugin --no-save --no-audit --no-fund ./
          fi

      - name: Build OpenTelemetry plugin
        run: npm run build --prefix packages/otel-plugin

      - name: Install demo app dependencies (for e2e tests)
        run: npm ci --prefix packages/rdcp-demo-app

      - name: Build
        run: npm run build

      - name: Lint (CI)
        run: npm run lint:ci

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Publish to npm (Node 20 only)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.node-version == '20.x'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view @rdcp.dev/server@"$CURRENT_VERSION" version >/dev/null 2>&1; then
            echo "Version $CURRENT_VERSION already published, skipping"
          else
            npm publish --access public
          fi
