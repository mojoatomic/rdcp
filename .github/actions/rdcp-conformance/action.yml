name: RDCP Conformance

inputs:
  base-url:
    description: Base URL of the target RDCP server
    required: true
  include-tags:
    description: Comma-separated include tags
    required: false
  exclude-tags:
    description: Comma-separated exclude tags
    required: false
  discovery-out:
    description: Output path for discovery JSON
    required: false
    default: reports/rdcp.discovery.json

outputs:
  tests-passed:
    description: Number of tests passed
    value: ${{ steps.set.outputs.tests_passed }}
  tests-total:
    description: Number of tests
    value: ${{ steps.set.outputs.tests_total }}
  pass-rate:
    description: Pass rate percent (rounded)
    value: ${{ steps.set.outputs.pass_rate }}
  suites-passed:
    description: Number of suites passed
    value: ${{ steps.set.outputs.suites_passed }}
  suites-total:
    description: Number of suites
    value: ${{ steps.set.outputs.suites_total }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
    - name: Sanity check (conformance runner present)
      shell: bash
      run: |
        test -f scripts/rdcp-conformance.mjs || { echo 'missing scripts/rdcp-conformance.mjs'; exit 1; }
    - name: Discovery
      shell: bash
      run: |
        FLAGS=""
        if [ -n "${{ inputs.include-tags }}" ]; then FLAGS="$FLAGS --include-tags=\"${{ inputs.include-tags }}\""; fi
        if [ -n "${{ inputs.exclude-tags }}" ]; then FLAGS="$FLAGS --exclude-tags=\"${{ inputs.exclude-tags }}\""; fi
        npx rdcp-conformance --base-url="${{ inputs.base-url }}" --out="${{ inputs.discovery-out }}" $FLAGS || \
        node scripts/rdcp-conformance.mjs --base-url="${{ inputs.base-url }}" --out="${{ inputs.discovery-out }}" $FLAGS
    - name: Run tests (conformance-mode)
      shell: bash
      run: npm test
    - name: Generate JUnit report
      shell: bash
      run: |
        npx rdcp-conformance-junit || node scripts/conformance-junit.mjs || echo 'JUnit generation skipped'
    - name: Generate badges
      shell: bash
      run: |
        npx rdcp-conformance-badges || node scripts/conformance-badges.mjs || echo 'Badge generation skipped'
    - name: Set outputs from results
      id: set
      shell: bash
      run: |
        node -e "
        const fs=require('fs');
        let r={summary:{}};
        try{ r=JSON.parse(fs.readFileSync('reports/rdcp.results.json','utf8')); }catch(e){}
        const s=r.summary||{};
        const p=Number(s.passed||0);
        const t=Number(s.total||0);
        const sp=Number(s.suitesPassed||0);
        const st=Number(s.suitesTotal||0);
        const rate=t?Math.round((p/t)*100):0;
        console.log('tests_passed='+p);
        console.log('tests_total='+t);
        console.log('pass_rate='+rate);
        console.log('suites_passed='+sp);
        console.log('suites_total='+st);
        " >> "$GITHUB_OUTPUT"
    - name: Upload conformance reports
      uses: actions/upload-artifact@v4
      with:
        name: rdcp-conformance-reports
        path: |
          reports/rdcp.results.json
          reports/rdcp.report.md
          reports/rdcp.junit.xml
          reports/badges
        if-no-files-found: warn
